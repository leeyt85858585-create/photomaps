<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대학로 사물함 지도</title>
<style>
:root{--bg:#f1f4f6;--surface:#fff;--ink:#16212b;--muted:#566573;--line:#d3dae0;--accent:#0d6a8a;--th:#6d4bb3;--lk:#c2410c;--hid:#64748b;--ls:#f59e0b;--font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#12181d;--surface:#1a232a;--ink:#e5ecf1;--muted:#9aa9b5;--line:#2c3841;--accent:#62b9d8;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#map{position:fixed!important;top:0;left:0;width:100vw;height:100vh;height:100dvh}
.top{position:absolute;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;align-items:center;z-index:20;pointer-events:none}
.top>*{pointer-events:auto}
.ttl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:700;font-size:14px;white-space:nowrap}
.ttl small{font-weight:400;color:var(--muted);font-size:11px;margin-left:4px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;font-size:13px;white-space:nowrap}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sp{flex:1}
#syB{font-size:11px;color:var(--muted)}
.panel{position:absolute;z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);overflow:auto}
#lg{right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 40px);width:250px;max-height:70vh;padding:10px 12px;display:none}
#lg.open{display:block}
#lg label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
#lg .sw{width:14px;height:14px;display:inline-block;flex:none}
#lg h4{margin:8px 0 2px;font-size:12px;color:var(--muted);font-weight:500}
#ls{left:8px;top:calc(max(8px,env(safe-area-inset-top)) + 40px);width:330px;max-height:62vh;display:none}
#ls.open{display:block}
#ls table{border-collapse:collapse;width:100%;font-size:12.5px}
#ls th,#ls td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
#ls th{position:sticky;top:0;background:var(--surface);font-weight:500;color:var(--muted)}
#ls tr[data-i]{cursor:pointer}#ls tr[data-i]:hover{background:rgba(13,106,138,.08)}
#ls .tabs{display:flex;gap:4px;padding:8px 8px 4px;position:sticky;top:0;background:var(--surface);z-index:1}
#ls .tabs button{border:1px solid var(--line);background:none;border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer}
#ls .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#dt{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-height:55vh;padding:12px 14px 14px;display:none}
#dt.open{display:block}
@media (min-width:900px){#dt{left:auto;width:400px;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 40px);bottom:auto;max-height:calc(100vh - 70px)}#lg{right:416px}}
#dt h2{margin:0 26px 4px 0;font-size:17px}
#dt .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
#dt dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0;font-size:13px}
#dt dt{color:var(--muted)}#dt dd{margin:0}
.bdg{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;margin:0 4px 2px 0;border:1px solid var(--line)}
.bdg.th{background:var(--th);color:#fff;border-color:var(--th)}.bdg.lk{background:var(--lk);color:#fff;border-color:var(--lk)}.bdg.hid{background:var(--hid);color:#fff;border-color:var(--hid)}.bdg.ls{background:var(--ls);color:#1b1300;border-color:var(--ls)}
.sec{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.sec h3{margin:0 0 4px;font-size:13px}
.muted{color:var(--muted);font-size:12px}
.links a{margin-right:10px;font-size:13px;color:var(--accent)}
.f label{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.f input,.f textarea,.f select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pb{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.gb{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.db{background:none;border:1px solid #b91c1c;color:#b91c1c;border-radius:8px;padding:6px 12px;cursor:pointer}
.db.arm{background:#b91c1c;color:#fff}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 44px);z-index:30;background:#16212b;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;display:none;white-space:nowrap}
#hint button{margin-left:8px;background:#fff;color:#16212b;border:0;border-radius:6px;padding:1px 8px;cursor:pointer}
/* markers */
.mk{position:relative;width:0;height:0}
.th-m{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:var(--th);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);font-size:11px}
.th-m.dim{background:#a99bc9}
.th-l{position:absolute;left:12px;top:-8px;font-size:11px;white-space:nowrap;color:#3b2a66;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;font-weight:500}
.lk-m{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:4px;background:var(--lk);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.lk-m.hid{background:var(--hid)}
.ls-m{position:absolute;left:-7px;top:-7px;width:14px;height:14px;transform:rotate(45deg);background:var(--ls);border:2px solid #fff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.ex-m{position:absolute;transform:translate(-50%,-50%);background:#0f766e;color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;border:1px solid #fff;white-space:nowrap}
.sel .th-m,.sel .lk-m{box-shadow:0 0 0 3px #facc15}.sel .ls-m{background:#1b1300;border-color:#fbbf24}
</style></head><body>
<div id="map"></div>
<div class="top">
  <div class="ttl">대학로 사물함 지도<small id="ver">v26.11.10 · 3</small></div>
  <button class="btn" id="lsBtn">목록</button>
  <div class="sp"></div>
  <span class="btn" id="syB">시트 확인 중</span>
  <button class="btn" id="addBtn">+ 매물</button>
  <button class="btn" id="lgBtn">범례</button>
</div>
<div id="hint"><span id="hintT"></span><button id="hintX">취소</button></div>
<div class="panel" id="lg">
  <h4>레이어 (켜기/끄기)</h4>
  <label><input type="checkbox" data-ly="th" checked><span class="sw" style="background:var(--th);border-radius:50%"></span>공연장 (숫자 = 종합 순위)</label>
  <label><input type="checkbox" data-ly="lk" checked><span class="sw" style="background:var(--lk);border-radius:3px"></span>경쟁 사물함</label>
  <label><input type="checkbox" data-ly="hid" checked><span class="sw" style="background:var(--hid);border-radius:3px"></span>숨은 보관소 (겸업·극장 내)</label>
  <label><input type="checkbox" data-ly="ls" checked><span class="sw" style="background:var(--ls);transform:rotate(45deg) scale(.8);border-radius:2px"></span>부동산 매물</label>
  <label><input type="checkbox" data-ly="ex" checked><span class="sw" style="background:#0f766e;border-radius:3px"></span>혜화역 출구</label>
  <label><input type="checkbox" data-ly="ring"><span class="sw" style="border:2px solid #0f766e;border-radius:50%"></span>1·2번 출구 도보 원</label>
  <div style="display:flex;gap:6px;align-items:center;padding-left:22px;font-size:12px">표시 <select id="ringM" style="padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"><option value="35">3분·5분</option><option value="3">3분 (240m)</option><option value="5">5분 (400m)</option></select></div>
  <label><input type="checkbox" data-ly="gap" checked><span class="sw" style="border:2px dashed #dc2626;border-radius:50%"></span>빈자리 공연장 (반경 안에 경쟁 사물함 없음)</label>
  <div style="display:flex;gap:6px;align-items:center;padding-left:22px;font-size:12px">반경 <select id="gapR" style="padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"><option>30</option><option selected>50</option><option>100</option><option>150</option></select> m</div>
  <h4>순위 기준</h4>
  <select id="rkSel" style="width:100%;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"></select>
  <p class="muted" id="rkNote"></p>
  <h4>시트 연결</h4>
  <p class="muted" id="syInfo"></p>
  <input id="syLink" placeholder="초대 링크 붙여넣기 (기존 임장지도와 같은 링크)" style="width:100%;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
</div>
<div class="panel" id="ls"></div>
<div class="panel" id="dt"><button class="x" id="dtX" aria-label="닫기">×</button><div id="dtB"></div></div>
<script src="data.js?v=3"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const isPhone = () => { try { return !!((navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)); } catch (e) { return false; } };
const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
const won = (n) => (n == null || n === "" || !isFinite(+n)) ? "미확인" : (+n).toLocaleString("ko-KR") + "만";
const eok = (n) => { if (n == null || n === "" || !isFinite(+n)) return "미확인"; n = +n; if (n === 0) return "없음"; const e = Math.floor(n), m = Math.round((n - e) * 10000); return (e ? e + "억" : "") + (m ? (e ? " " : "") + m.toLocaleString("ko-KR") + "만" : ""); };
function dist(a, b, c, d) { const R = 6371000, r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return Math.round(Math.sqrt(x * x + y * y) * R); }
const walk = (m) => Math.max(1, Math.round(m / 75)) + "분";

/* ---------- 시트 동기화: 기존 임장지도와 같은 저장값(같은 주소 아래라 자동 공유) ---------- */
const SYK = "hongdae-imjang-sync-v1";
let sy = Object.assign({ url: "", token: "", who: "" }, LS(SYK) || {});
const syOn = () => !!(sy.url && sy.token);
const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = (t) => JSON.parse(decodeURIComponent(escape(atob(t))));
(function applyInvite() {
  let code = ""; try { code = new URLSearchParams(location.search).get("sync") || ""; } catch (e) {}
  const m = code ? [null, code] : /^#sync=(.+)$/.exec(location.hash || ""); if (!m) return;
  try { const o = dec(decodeURIComponent(m[1])); if (o && o.u && o.t) { sy = { url: String(o.u), token: String(o.t), who: o.w === "이" || o.w === "홍" ? o.w : sy.who || "" }; LS(SYK, sy); } } catch (e) {}
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
})();
function syBadge(t) { $("#syB").textContent = t; $("#syInfo").textContent = syOn() ? "연결됨" + (sy.who ? " · " + sy.who : "") + " — 기존 임장지도와 같은 시트에 저장됩니다." : "미연결 — 이 기기에만 저장됩니다. 기존 임장지도 초대 링크를 붙여넣으면 연결됩니다."; }
$("#syLink").addEventListener("input", () => {
  const v = $("#syLink").value; const m = /[#?&]sync=([A-Za-z0-9+\/=_%-]+)/.exec(v); if (!m) return;
  try { const o = dec(decodeURIComponent(m[1])); if (o && o.u && o.t) { sy = { url: String(o.u), token: String(o.t), who: o.w === "이" || o.w === "홍" ? o.w : sy.who || "" }; LS(SYK, sy); $("#syLink").value = ""; syAll(); } } catch (e) { syBadge("초대 링크를 읽지 못했습니다"); }
});
async function syPost(p) {
  const r = await fetch(sy.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ token: sy.token, who: sy.who }, p)) });
  const j = await r.json(); if (!j.ok) throw new Error(j.err || "fail"); return j;
}

/* 로컬 저장 */
const ST = Object.assign({ lk: {}, ls: {} }, LS("lockermap_store") || {});
const save = () => LS("lockermap_store", ST);

/* 사물함 메모·오픈시기·위치: 기존 임장지도와 같은 키(보관|이름|좌표) → 어느 지도에서 입력해도 양쪽에 보임 */
const LKK = "보관|";
const lkKey = (l) => LKK + (l.kn || l.n) + "|" + (+l.la).toFixed(6) + "," + (+l.lo).toFixed(6);
/* 사물함지도 전용 매물: '보관매물|' 키, 위도·경도 칸은 비우고 권역 칸에 '@위도,경도'(기존 지도가 사진매장으로 오인하지 않도록) */
const LSK = "보관매물|";

let pulling = false, flushing = false;
async function syPull() {
  if (!syOn() || pulling) return; pulling = true;
  try {
    const j = await syPost({ action: "list" }); let ch = 0;
    (j.rows || []).forEach((w) => {
      const k = String(w.key);
      const pm = /@\s*([\d.]+)\s*,\s*([\d.]+)/.exec(String(w.area || "")), pos = pm ? [+pm[1], +pm[2]] : undefined;
      const ts = Number(w.ts) || 0;
      if (k.startsWith(LKK)) {
        if (w.del) return; const loc = ST.lk[k]; if (loc && !loc.up) return; if (loc && ts <= (Number(loc.t) || 0)) return;
        const ns = (Array.isArray(w.notes) ? w.notes : []).filter((n) => n && !n.del);
        ST.lk[k] = { open: String(w.cls || "").replace(/^오픈\s*/, ""), memo: ns.map((n) => String(n.t || "")).join("\n"), t: ts, who: (ns[0] && ns[0].w) || "", up: 1 }; if (pos) ST.lk[k].pos = pos; ch++;
      } else if (k.startsWith(LSK)) {
        const loc = ST.ls[k]; if (loc && !loc.up) return; if (loc && ts <= (Number(loc.t) || 0)) return;
        if (w.del) { if (loc) { delete ST.ls[k]; ch++; } return; }
        let f = {}; try { f = JSON.parse(String(w.cls || "{}")); } catch (e) {}
        const ns = (Array.isArray(w.notes) ? w.notes : []).filter((n) => n && !n.del);
        if (!pos) return;
        ST.ls[k] = Object.assign({ name: String(w.name || "매물"), addr: String(w.addr || ""), la: pos[0], lo: pos[1], memo: ns.map((n) => String(n.t || "")).join("\n"), t: ts, who: (ns[0] && ns[0].w) || "", up: 1 }, f); ch++;
      }
    });
    if (ch) { save(); drawLockers(); drawListings(); if (sel && !isEditing()) renderDetail(); }
    syBadge("시트 연결됨");
  } catch (e) { syBadge("시트 불러오기 실패"); }
  finally { pulling = false; }
}
async function syFlush() {
  if (!syOn() || flushing) return; flushing = true;
  try {
    for (const l of LOCK) {
      const k = lkKey(l), x = ST.lk[k]; if (!x || x.up) continue; const ts = Number(x.t) || Date.now();
      await syPost({ action: "set", key: k, name: l.n, addr: l.j, area: "짐보관" + (Array.isArray(x.pos) ? " @" + (+x.pos[0]).toFixed(7) + "," + (+x.pos[1]).toFixed(7) : ""), visited: 0, cls: x.open ? "오픈 " + x.open : "", notes: x.memo ? [{ id: k + "|m", w: x.who || "", t: x.memo, c: ts, ts, del: 0 }] : [], booth: "", lat: "", lng: "", ts, dev: isPhone() ? "폰" : "PC" });
      if ((Number(ST.lk[k].t) || 0) === ts) ST.lk[k].up = 1; save();
    }
    for (const k of Object.keys(ST.ls)) {
      const x = ST.ls[k]; if (x.up) continue; const ts = Number(x.t) || Date.now();
      if (x.del) { await syPost({ action: "set", key: k, name: x.name || "", addr: x.addr || "", area: "보관매물", del: 1, ts }); delete ST.ls[k]; save(); continue; }
      const f = {}; LSF.forEach((n) => { if (x[n] !== undefined && x[n] !== "") f[n] = x[n]; });
      await syPost({ action: "set", key: k, name: x.name || "매물", addr: x.addr || "", area: "보관매물 @" + (+x.la).toFixed(7) + "," + (+x.lo).toFixed(7), visited: 0, cls: JSON.stringify(f), notes: x.memo ? [{ id: k + "|m", w: x.who || "", t: x.memo, c: ts, ts, del: 0 }] : [], booth: "", lat: "", lng: "", ts, dev: isPhone() ? "폰" : "PC" });
      if (ST.ls[k] && (Number(ST.ls[k].t) || 0) === ts) ST.ls[k].up = 1; save();
    }
    syBadge("시트 저장 완료 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) { syBadge("시트 저장 실패 · 다음에 자동 재시도"); }
  finally { flushing = false; }
}
async function syAll() { if (!syOn()) { syBadge("시트 미연결"); return; } syBadge("동기화 중…"); await syPull(); await syFlush(); }  // 항상 받기 먼저, 올리기 나중
const LSF = ["floor", "area", "dep", "rent", "prem", "mng", "elec", "sign", "use", "src", "date", "sc"];

/* ---------- 지도 ---------- */
let map = null, sel = null, layerOn = Object.assign({ th: true, lk: true, hid: true, ls: true, ex: true, ring: false, gap: true }, LS("lockermap_layers") || {});
const MK = { th: [], lk: [], hid: [], ls: [], ex: [], ring: [], gap: [] };
let RK = (LS("lockermap_rank") || "total");
let GAPR = +(LS("lockermap_gapr") || 50);
const RING_EX = ["1번", "2번"];
let RINGM = String(LS("lockermap_ringm") || "35");

function rankOf(t) { return (t.rk && t.rk[RK]) || null; }
function sortedTheaters() { return THEATERS.slice().sort((a, b) => (rankOf(a) || 999) - (rankOf(b) || 999) || a.n.localeCompare(b.n, "ko")); }

function clear(ly) { MK[ly].forEach((m) => m.setMap(null)); MK[ly] = []; }
function mk(pos, html, z, onclick, ly) {
  const m = new naver.maps.Marker({ map: layerOn[ly] ? map : null, position: new naver.maps.LatLng(pos[0], pos[1]), zIndex: z, icon: { content: html, anchor: new naver.maps.Point(0, 0) } });
  if (onclick) naver.maps.Event.addListener(m, "click", (e) => { onclick(); });
  MK[ly].push(m); return m;
}
const isSel = (t, i) => sel && sel.t === t && sel.i === i;

function drawTheaters() {
  clear("th"); clear("gap");
  THEATERS.forEach((t, i) => {
    if (!isFinite(t.la)) return;
    const r = rankOf(t), sz = r ? (r <= 3 ? 30 : r <= 10 ? 24 : 18) : 16;
    mk([t.la, t.lo], '<div class="mk' + (isSel("th", i) ? " sel" : "") + '"><div class="th-m' + (r && r <= 10 ? "" : " dim") + '" style="width:' + sz + 'px;height:' + sz + 'px">' + (r || "·") + '</div>' + (r && r <= 10 ? '<div class="th-l">' + esc(t.short || t.n) + '</div>' : "") + '</div>', r && r <= 10 ? 30 - r : 5, () => select("th", i), "th");
  });
  // 사물함 공백: 상위 10 공연장 중 150m 안에 경쟁 사물함·숨은 보관소가 없는 곳
